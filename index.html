<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>木材加工互動影片測驗</title>
  <style>
    :root {
      --navy: #142b3f;
      --teal: #167d78;
      --teal-dark: #0e625e;
      --paper: #f5f2ea;
      --ink: #17242f;
      --muted: #64717a;
      --border: #d7ddd8;
      --good: #157347;
      --bad: #b42318;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang HK", "Microsoft JhengHei", sans-serif;
      line-height: 1.55;
    }

    header {
      padding: 18px 24px;
      color: var(--white);
      background: var(--navy);
      box-shadow: 0 2px 8px rgba(0,0,0,.18);
    }

    header h1 { margin: 0; font-size: clamp(1.2rem, 2.5vw, 1.65rem); }
    header p { margin: 4px 0 0; opacity: .85; font-size: .92rem; }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(320px, .9fr);
      gap: 22px;
      max-width: 1440px;
      margin: 0 auto;
      padding: 24px;
    }

    .panel {
      overflow: hidden;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(20, 43, 63, .08);
    }

    .panel-heading {
      padding: 14px 18px;
      color: var(--white);
      background: var(--teal);
      font-weight: 700;
    }

    .video-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    #player { width: 100%; height: 100%; }

    .video-note { padding: 12px 18px 16px; color: var(--muted); font-size: .9rem; }

    .quiz-body { padding: 20px; }

    .status {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      margin-bottom: 12px;
      padding: 4px 10px;
      border-radius: 99px;
      color: var(--teal-dark);
      background: #e2f3f0;
      font-size: .85rem;
      font-weight: 700;
    }

    .timecode { color: var(--muted); font-size: .9rem; }
    h2 { margin: 4px 0 12px; font-size: 1.25rem; }
    .question { margin: 0 0 18px; font-size: 1.05rem; font-weight: 650; }

    .options { display: grid; gap: 10px; }

    .option {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }

    .option:hover { border-color: var(--teal); background: #f2fbf9; }
    .option input { margin-top: 4px; accent-color: var(--teal); }
    .option strong { min-width: 1.35em; }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 12px 16px;
      border: 0;
      border-radius: 9px;
      color: var(--white);
      background: var(--teal);
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      transition: background .15s, transform .1s;
    }

    button:hover { background: var(--teal-dark); }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: .55; cursor: not-allowed; }

    .feedback { min-height: 1.6em; margin: 13px 0 0; font-weight: 700; }
    .feedback.good { color: var(--good); }
    .feedback.bad { color: var(--bad); }

    .waiting, .complete { text-align: center; padding: 32px 10px; }
    .waiting p, .complete p { color: var(--muted); }
    .complete h2 { color: var(--good); }

    .progress { height: 8px; margin: 14px 0 0; overflow: hidden; border-radius: 99px; background: #e7ece9; }
    .progress > div { height: 100%; width: 0%; background: var(--teal); transition: width .25s; }

    .notice {
      margin: 0 24px 24px;
      padding: 12px 14px;
      border-left: 4px solid #d08700;
      color: #6e5100;
      background: #fff6dc;
      border-radius: 4px;
      font-size: .88rem;
    }

    @media (max-width: 850px) {
      main { grid-template-columns: 1fr; padding: 16px; }
      .quiz-panel { order: -1; }
      header { padding: 16px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>木材加工互動影片測驗</h1>
    <p>觀看影片；當影片到達指定時間，請在右側回答問題才能繼續。</p>
  </header>

  <main>
    <section class="panel" aria-label="YouTube 影片">
      <div class="panel-heading">教學影片</div>
      <div class="video-wrap"><div id="player"></div></div>
      <div class="video-note">請按影片播放器上的「播放」開始。每次答對後，影片會自動繼續播放。</div>
    </section>

    <aside class="panel quiz-panel" aria-live="polite">
      <div class="panel-heading">即時測驗</div>
      <div class="quiz-body" id="quizArea">
        <div class="waiting">
          <h2>準備開始</h2>
          <p>請在左側按下播放。影片會在指定時間自動暫停並顯示問題。</p>
        </div>
        <div class="progress" aria-label="答題進度"><div id="progressBar"></div></div>
      </div>
    </aside>
  </main>

  <div class="notice">
    若使用者的網絡、學校防火牆或瀏覽器私隱設定封鎖 YouTube 嵌入影片，播放器可能無法載入；請允許 YouTube 的嵌入內容後再試。
  </div>

  <script>
    const questions = [
      {
        time: 75,
        title: "1. 可持續林業與伐木管理",
        timeLabel: "約 01:15（伐木機／機械化採伐作業畫面）",
        text: "在伐木過程中，實施「選擇性採伐」（Selective Logging）及「重植樹木」的主要目的是什麼？",
        options: {
          A: "確保所有採伐出的木材具有完全相同的直徑與長度",
          B: "保護森林生態平衡，並確保天然木材資源能持續供應",
          C: "降低伐木機械的燃料消耗與設備維修成本",
          D: "加快樹木在砍伐後的自然生長速度"
        },
        answer: "B"
      },
      {
        time: 210,
        title: "2. 機械去皮與廢料循環再用",
        timeLabel: "約 03:30（原木進入機械去皮機）",
        text: "在鋸切原木前必須先進行「機械去皮」（Debarking）以保護鋸片。剝下的樹皮通常會如何處置以達到零廢料生產？",
        options: {
          A: "直接傾倒至海洋作為魚類養分",
          B: "重新黏合製作成高密度膠合板（Plywood）",
          C: "用於工廠燃燒發電或轉化為園藝覆蓋物（Mulch）",
          D: "浸泡在化學藥劑中轉化為人工合成樹脂"
        },
        answer: "C"
      },
      {
        time: 370,
        title: "3. 3D 鐳射掃描與鋸切優化",
        timeLabel: "約 06:10（3D 光學鐳射掃描儀器）",
        text: "現代木材加工廠在鋸切原木前會先使用 3D 鐳射掃描器，其主要功能是什麼？",
        options: {
          A: "利用高溫鐳射光束直接將原木切割成板材",
          B: "改變原木內部的結構，將軟木（Softwood）轉化為硬木（Hardwood）",
          C: "精確測量原木外形以計算最佳鋸切方案，從而最大化木材出產率",
          D: "殺滅原木內部隱藏的所有害蟲及蟲卵"
        },
        answer: "C"
      },
      {
        time: 585,
        title: "4. 窯乾法與木材養生處理",
        timeLabel: "約 09:45（木材裝入窯乾室）",
        text: "在香港潮濕的氣候環境下，如果直接使用未經「窯乾處理」（Kiln Drying）的未乾木材（Green Timber）製作家具，最容易引致以下哪種問題？",
        options: {
          A: "木材表面過於光滑，無法塗上木油或漆油",
          B: "木材因水分流失與環境濕度變化而產生彎曲（Warping）或開裂",
          C: "木材會立即轉變為軟木，失去結構承重能力",
          D: "木材密度會突然大幅增加，變得過於沉重"
        },
        answer: "B"
      },
      {
        time: 740,
        title: "5. 刨光加工與結構等級印章",
        timeLabel: "約 12:20（高速刨床與結構等級蓋印）",
        text: "經過「四面刨光」（PAR - Planed All Round）處理的木材與「粗鋸木材」（Rough-sawn Timber）相比，有何主要差別？",
        options: {
          A: "PAR 木材的尺寸更精準且四面平滑，但實際截面尺寸會略小於原標稱尺寸",
          B: "PAR 木材的硬度大幅提升，不再需要進行任何表面塗裝",
          C: "PAR 木材不再具有天然木紋，表面變得像塑膠一樣",
          D: "PAR 木材的價格遠低於粗鋸木材，適合粗糙工程使用"
        },
        answer: "A"
      }
    ];

    let player;
    let currentQuestion = 0;
    let questionVisible = false;
    let finished = false;
    let pollTimer;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: '7zJxMmfrVhI',
        playerVars: {
          autoplay: 0,
          controls: 1,
          rel: 0,
          playsinline: 1,
          origin: window.location.origin
        },
        events: {
          onReady: () => { pollTimer = setInterval(checkVideoTime, 250); },
          onStateChange: onPlayerStateChange
        }
      });
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.ENDED && currentQuestion === questions.length && !finished) {
        showCompletion();
      }
    }

    function checkVideoTime() {
      if (!player || typeof player.getCurrentTime !== 'function' || questionVisible || finished) return;
      if (currentQuestion >= questions.length) return;
      const target = questions[currentQuestion];
      const now = player.getCurrentTime();
      if (now >= target.time && player.getPlayerState() === YT.PlayerState.PLAYING) {
        player.pauseVideo();
        questionVisible = true;
        showQuestion(target);
      }
    }

    function showQuestion(q) {
      const optionHtml = Object.entries(q.options).map(([letter, text]) => `
        <label class="option">
          <input type="radio" name="answer" value="${letter}">
          <span><strong>${letter}.</strong> ${text}</span>
        </label>`).join('');

      document.getElementById('quizArea').innerHTML = `
        <div class="status">影片已暫停 · 請先答題</div>
        <div class="timecode">${q.timeLabel}</div>
        <h2>${q.title}</h2>
        <p class="question">${q.text}</p>
        <form id="answerForm">
          <div class="options">${optionHtml}</div>
          <button type="submit">提交答案並繼續</button>
        </form>
        <p class="feedback" id="feedback"></p>
        <div class="progress" aria-label="答題進度"><div id="progressBar" style="width:${(currentQuestion / questions.length) * 100}%"></div></div>`;

      document.getElementById('answerForm').addEventListener('submit', (event) => {
        event.preventDefault();
        const selected = document.querySelector('input[name="answer"]:checked');
        const feedback = document.getElementById('feedback');
        if (!selected) {
          feedback.className = 'feedback bad';
          feedback.textContent = '請先選擇一個答案。';
          return;
        }
        if (selected.value === q.answer) {
          feedback.className = 'feedback good';
          feedback.textContent = '答對了！影片即將繼續播放。';
          document.querySelectorAll('input[name="answer"]').forEach(input => input.disabled = true);
          document.querySelector('#answerForm button').disabled = true;
          currentQuestion += 1;
          document.getElementById('progressBar').style.width = `${(currentQuestion / questions.length) * 100}%`;
          setTimeout(() => {
            questionVisible = false;
            if (player) player.playVideo();
          }, 850);
        } else {
          feedback.className = 'feedback bad';
          feedback.textContent = '答案不正確，請再嘗試一次。影片會保持暫停。';
        }
      });
    }

    function showCompletion() {
      finished = true;
      document.getElementById('quizArea').innerHTML = `
        <div class="complete">
          <div class="status">完成</div>
          <h2>恭喜！你已完成全部問題。</h2>
          <p>你已答對所有 5 題，並完成觀看影片。</p>
          <div class="progress" aria-label="答題進度"><div style="width:100%"></div></div>
        </div>`;
    }

    // This API supports the YouTube iframe player across modern desktop and mobile browsers.
    const ytScript = document.createElement('script');
    ytScript.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(ytScript);
  </script>
</body>
</html>
