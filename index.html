<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Interactive YouTube Quiz Builder</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
      text-align: center;
    }

    header h1 {
      font-size: 1.5rem;
      color: var(--primary);
    }

    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
      gap: 1.5rem;
      padding: 1.5rem;
    }

    /* Left & Right Panel Containers */
    .panel {
      flex: 1;
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      overflow-y: auto;
    }

    .panel-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .form-group {
      margin-bottom: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    label {
      font-size: 0.875rem;
      font-weight: 500;
      color: #475569;
    }

    input, select, button {
      padding: 0.6rem 0.8rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    /* Video Section */
    .video-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      margin-top: 1rem;
    }

    .video-wrapper iframe, .video-placeholder {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .video-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      background-color: #1e293b;
      text-align: center;
      padding: 1rem;
    }

    /* Quiz Section */
    .controls-row {
      display: flex;
      gap: 1rem;
    }

    .controls-row .form-group {
      flex: 1;
    }

    .quiz-container {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .question-card {
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1rem;
      background-color: #fafafa;
    }

    .question-title {
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .option-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: white;
      padding: 0.5rem 0.8rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
    }

    .option-item:hover {
      background: #f1f5f9;
    }

    .loading-spinner {
      display: none;
      text-align: center;
      padding: 2rem;
      color: #64748b;
    }

    .score-banner {
      display: none;
      background: #dcfce7;
      color: #166534;
      padding: 1rem;
      border-radius: 6px;
      margin-top: 1rem;
      font-weight: 600;
      text-align: center;
    }

    /* Responsive Stack for small screens */
    @media (max-width: 900px) {
      .main-container {
        flex-direction: column;
        overflow-y: auto;
      }
      .panel {
        overflow-y: visible;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Interactive YouTube Quiz Builder</h1>
  </header>

  <div class="main-container">
    
    <!-- LEFT SIDE: Video Input & Player -->
    <div class="panel">
      <div class="panel-title">🎥 Video Player</div>
      
      <div class="form-group">
        <label for="youtube-url">YouTube Link</label>
        <div style="display: flex; gap: 0.5rem;">
          <input type="text" id="youtube-url" style="flex: 1;" placeholder="https://www.youtube.com/watch?v=..." />
          <button onclick="loadVideo()">Load Video</button>
        </div>
      </div>

      <div class="video-wrapper">
        <div id="placeholder" class="video-placeholder">Enter a YouTube link above and click "Load Video".</div>
        <iframe id="youtube-iframe" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="display: none;"></iframe>
      </div>
    </div>

    <!-- RIGHT SIDE: Quiz Generation & Questions -->
    <div class="panel">
      <div class="panel-title">📝 Video Quiz</div>

      <div class="controls-row">
        <div class="form-group">
          <label for="question-count">Number of Questions</label>
          <input type="number" id="question-count" value="3" min="1" max="10" />
        </div>
        <div class="form-group">
          <label for="api-key">Gemini API Key <small>(Optional)</small></label>
          <input type="password" id="api-key" placeholder="AI Key for live video quiz generation" />
        </div>
      </div>

      <button id="generate-btn" onclick="generateQuestions()">Generate Questions</button>

      <div id="loading" class="loading-spinner">
        ⏳ Analyzing video & generating quiz questions...
      </div>

      <div id="quiz-container" class="quiz-container"></div>
      
      <div id="score-banner" class="score-banner"></div>
      
      <button id="submit-btn" style="display: none; margin-top: 1.5rem;" onclick="gradeQuiz()">Submit Answers</button>
    </div>

  </div>

  <script>
    let currentQuizData = [];

    // Helper: Extract YouTube Video ID from any standard link
    function getYouTubeVideoId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    // Load YouTube video in the Left iframe
    function loadVideo() {
      const url = document.getElementById('youtube-url').value.trim();
      const videoId = getYouTubeVideoId(url);
      const iframe = document.getElementById('youtube-iframe');
      const placeholder = document.getElementById('placeholder');

      if (videoId) {
        iframe.src = `https://www.youtube.com/embed/${videoId}`;
        iframe.style.display = 'block';
        placeholder.style.display = 'none';
      } else {
        alert('Please enter a valid YouTube URL.');
      }
    }

    // Generate Questions Logic
    async function generateQuestions() {
      const videoUrl = document.getElementById('youtube-url').value.trim();
      const numQuestions = document.getElementById('question-count').value || 3;
      const apiKey = document.getElementById('api-key').value.trim();
      const videoId = getYouTubeVideoId(videoUrl);

      if (!videoId) {
        alert('Please load a valid YouTube video first!');
        return;
      }

      const quizContainer = document.getElementById('quiz-container');
      const loading = document.getElementById('loading');
      const submitBtn = document.getElementById('submit-btn');
      const scoreBanner = document.getElementById('score-banner');

      quizContainer.innerHTML = '';
      scoreBanner.style.display = 'none';
      submitBtn.style.display = 'none';
      loading.style.display = 'block';

      if (apiKey) {
        // Real Generation via Gemini API
        try {
          const prompt = `You are an educational assistant. Generate exactly ${numQuestions} multiple-choice quiz questions based on this YouTube video: ${videoUrl}. Return ONLY a raw JSON array of objects with keys: "question" (string), "options" (array of 4 strings), and "answerIndex" (integer 0-3 for correct option). Do not wrap in markdown tags like \`\`\`json.`;
          
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }]
            })
          });

          const data = await response.json();
          let rawText = data.candidates[0].content.parts[0].text.trim();
          rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
          
          currentQuizData = JSON.parse(rawText);
          renderQuiz(currentQuizData);
        } catch (error) {
          console.error(error);
          alert('Failed to generate with API Key. Falling back to demo generator mode.');
          generateDemoQuiz(videoId, numQuestions);
        }
      } else {
        // Fallback Demo Quiz Generator when no API key is provided
        setTimeout(() => {
          generateDemoQuiz(videoId, numQuestions);
        }, 800);
      }

      loading.style.display = 'none';
    }

    // Demo / Fallback Quiz Generator
    function generateDemoQuiz(videoId, count) {
      currentQuizData = [];
      for (let i = 1; i <= count; i++) {
        currentQuizData.push({
          question: `Question ${i}: What key point or concept is explained in segment ${i} of this video?`,
          options: [
            `Concept A (Correct Answer)`,
            `Concept B`,
            `Concept C`,
            `Concept D`
          ],
          answerIndex: 0
        });
      }
      renderQuiz(currentQuizData);
    }

    // Render Quiz Cards into HTML
    function renderQuiz(questions) {
      const quizContainer = document.getElementById('quiz-container');
      quizContainer.innerHTML = '';

      questions.forEach((q, qIndex) => {
        const card = document.createElement('div');
        card.className = 'question-card';

        const qTitle = document.createElement('div');
        qTitle.className = 'question-title';
        qTitle.innerText = `${qIndex + 1}. ${q.question}`;
        card.appendChild(qTitle);

        const optionsList = document.createElement('div');
        optionsList.className = 'options-list';

        q.options.forEach((opt, optIndex) => {
          const label = document.createElement('label');
          label.className = 'option-item';
          
          const radio = document.createElement('input');
          radio.type = 'radio';
          radio.name = `q-${qIndex}`;
          radio.value = optIndex;

          label.appendChild(radio);
          label.appendChild(document.createTextNode(` ${opt}`));
          optionsList.appendChild(label);
        });

        card.appendChild(optionsList);
        quizContainer.appendChild(card);
      });

      document.getElementById('submit-btn').style.display = 'block';
    }

    // Grade Student Answers
    function gradeQuiz() {
      let score = 0;
      currentQuizData.forEach((q, index) => {
        const selected = document.querySelector(`input[name="q-${index}"]:checked`);
        if (selected && parseInt(selected.value) === q.answerIndex) {
          score++;
        }
      });

      const scoreBanner = document.getElementById('score-banner');
      scoreBanner.innerText = `You scored ${score} out of ${currentQuizData.length}! 🎉`;
      scoreBanner.style.display = 'block';
    }
  </script>
</body>
</html>
